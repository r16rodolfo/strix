# TEMPLATE — Sincronização de fork com upstream
# Copie para .github/workflows/ DE CADA FORK (r16rodolfo/*). NÃO roda no kerno-seize
# (que não tem upstream). Ajuste UPSTREAM para o repo original do fork.
#
# Estratégia: tenta fast-forward via gh repo sync; se o fork divergiu (customizações),
# o sync falha e o passo seguinte avisa (issue no fork, se possível) e derruba o job —
# um fork com Issues desabilitadas ainda fecha vermelho, nunca falha em silêncio.

name: ⟳ Sync com upstream

on:
  schedule:
    - cron: '0 8 1 * *'   # dia 1 de cada mês, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  UPSTREAM: usestrix/strix

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: gh repo sync (fast-forward)
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh repo sync ${{ github.repository }} --source ${{ env.UPSTREAM }}
          echo "result=$?" >> "$GITHUB_OUTPUT"

      - name: Avisar que o sync falhou (fork divergiu)
        if: steps.sync.outputs.result != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const aviso = `O fast-forward com \`${process.env.UPSTREAM}\` falhou — o fork tem commits próprios. `
              + 'Sincronize via branch + PR a partir de `upstream/main`, resolva conflitos e atualize a '
              + 'matriz no kerno-seize (KERNO-COMPATIBILITY.md).';

            // Forks nascem com Issues DESABILITADAS no GitHub. Se criar a issue falhar, o aviso
            // não pode morrer junto: cai no summary do run e o job fecha vermelho.
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `⟳ Sync manual necessário com ${process.env.UPSTREAM}`,
                body: aviso,
                labels: ['sync-upstream'],
              });
              core.warning('Sync divergiu — issue aberta neste fork.');
            } catch (e) {
              core.warning(`Não consegui abrir a issue (${e.status || e.message}) — Issues desabilitadas no fork?`);
            }

            await core.summary.addHeading('⟳ Sync com upstream falhou').addRaw(aviso).write();
            core.setFailed(aviso);
